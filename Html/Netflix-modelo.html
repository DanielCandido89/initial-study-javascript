<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Studio</title>

    <style>
      body {
        background-image: url(https://assets.nflxext.com/ffe/siteui/vlv3/eaa165a3-80a7-44cb-8df6-be1a7e225369/web/BR-pt-20260706-TRIFECTA-perspective_f073b5b0-227f-44ab-a4e3-967a27f2b843_large.jpg);
        background-size: cover;
        background-position: center;
      }

      #heading {
        background-color: rgba(0, 0, 0, 0.5);
      }

      * {
        margin: 0;
        padding: 0;
      }

      #heading div {
        width: 90%;
        justify-content: space-between;
        display: flex;
        margin: 0 auto;
      }

      #heading .h1 {
        padding: 15px 0;
        font-size: 20px;
        text-transform: uppercase;
      }
      #heading a {
        color: #fff;
        text-decoration: none;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <header id="heading">
      <div>
        <h1 class="h1">
          <a href="#">Netflix</a>
        </h1>

        <h2 class="h1 na-direita">
          <a href="#">Netflix</a>
        </h2>
      </div>
    </header>
  </body>
</html>
