<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Html</title>
    <style>
      body {
        font-family: sans-serif;
      }
      label {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <form action="#" method="get" target="_blank" autocomplete="off">
      <p>O meu formulário</p>
      <p>
        <label for="nome"> Nome:</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Seu nome"
          required
        />
      </p>
      <p>
        Gênero:<br />
        <label for="Feminino">Feminino</label>
        <input type="radio" id="Feminino" name="genero" value="sim" /><br />

        <label for="Masculino">Masculino</label>
        <input
          type="radio"
          id="Masculino"
          name="genero"
          value="Masculino"
        /><br />

        <label for="Outro">Outro</label>
        <input type="radio" id="Outro" name="genero" value="Outro" />
      </p>
      <p>
        <label for="dev">Sou um dev</label>
        <input type="checkbox" id="dev" name="dev" value="sim" /><br />

        <label for="dev2">Sou um dev2</label>
        <input type="checkbox" id="dev2" name="dev2" value="sim" /><br />

        <label for="dev3">Sou um dev3</label>
        <input type="checkbox" id="dev3" name="dev3" value="sim" />
      </p>
      <p>
        <label for="Data">Data:</label>
        <input type="date" id="Data" name="Data" value="2020-04-20" />
      </p>
      <p>
        <label for="datetime">Data:</label>
        <input
          type="datetime-local"
          id="datetime"
          name="datetime"
          value="2020-04-20T20:00"
        />
      </p>
      <p>
        <label for="time">Date:</label>
        <input type="time" id="time" name="time" value="20:00:01" />
      </p>
      <p>
        <label for="cor">Cor preferida:</label>
        <input type="color" id="cor" name="cor" value="#FF0000" />
      </p>
      <p>
        <label for="email">Seu e-mail:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Ex: email@email.com"
        />
      </p>
      <p>
        <label for="file">Sua foto:</label>
        <input
          type="file"
          id="file"
          name="file"
          accept=".png,.svg,image/*"
          multiple
        />
      </p>
      <p>
        <label for="number">Number:</label>
        <input
          type="number"
          id="number"
          name="number"
          placeholder="Digite um número"
          min="10"
          max="50"
        />
      </p>

      <p>
        <label for="password">Sua senha:</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Digite sua senha"
        />
      </p>
      <p>
        <label for="range">Range:</label>
        <input type="range" id="range" name="range" min="0" max="30" step="2" />
      </p>
      <p>
        <label for="url">URL:</label>
        <input type="url" id="url" name="url" placeholder="Digite uma url" />
      </p>
      <p>
        <label for="search">Search:</label>
        <input type="search" id="search" name="search" placeholder="Search" />
      </p>

      <p>
        <label for="select">Selecione alguma opção:</label>
        <select id="select name=select">
          <option value="qualquer 1" label="Rio de Janeiro"></option>
          <option value="qualquer 2" label="São Paulo"></option>
          <option value="qualquer 3" label="Minas Gerais" disabled></option>
          <option value="qualquer 4" label="Espírito Santo"></option>
        </select>
      </p>
      <p>
        <label for="textarea">Textarea:</label>
        <textarea name="textarea" id="textarea"></textarea>
      </p>

      <p>
        <button type="submit">Enviar</button>
        <button type="reset">Reset</button>
      </p>
    </form>
  </body>
</html>
