<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu html</title>

    <style>
      .section-one {
        width: 200px;
        background-color: deeppink;
        padding: 15px 0 10px;
        background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvThhPGFMjmP2S2dCHaCYN1z6EgKraWFP2o4spRXXInA&s=10);
        background-size: cover;
        background-position: center center;
        color: #fff;
        margin: 20px;
        height: 50px;
        border-top: 10px solid yellow;
        border-right: 10px solid green;
        border-left: 10px solid blue;
        border-bottom: 10px solid blueviolet;
      }

      .section-two {
        height: 50px;
        padding: 15px;
        margin: 20px;
        width: 200px;
        border: 5px solid black;
        background-color: cyan;
      }
    </style>
  </head>
  <body>
    <section class="section-one">
      Lorem ipsum dolor sit amet consectetur adipisicing elit.
    </section>

    <section class="section-two">2</section>
  </body>
</html>
